project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - framework.qmd
    - metrics.qmd
    - reproducibility.qmd
    - studies/index.qmd
    - studies/01_finemapping/report.qmd
    - studies/02_prediction/report.qmd
    - studies/03_parameter_estimation/report.qmd
    - studies/04_convergence/report.qmd
    - studies/05_ld_operator/report.qmd
    - studies/06_annotation_models/annotation-convergence.qmd
  resources:
    - results/reference/**
    - studies/05_ld_operator/analysis.R
    - studies/05_ld_operator/spec.R
    - studies/05_ld_operator/operator-design.R
    - inst/templates/operator-analysis.R

website:
  title: "sblrbench"
  site-url: "https://psoerensen.github.io/sblrbench/"
  repo-url: "https://github.com/psoerensen/sblrbench"
  repo-actions: [source, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: framework.qmd
        text: Framework
      - href: metrics.qmd
        text: Metrics
      - href: studies/index.qmd
        text: Benchmarks
      - href: reproducibility.qmd
        text: Reproducibility

format:
  html:
    toc: true
    code-fold: true
    code-tools: true
    theme: cosmo
    css: styles.css

execute:
  freeze: auto
  warning: false
  message: false
