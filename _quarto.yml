project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - framework.qmd
    - metrics.qmd
    - reproducibility.qmd
    - studies/index.qmd
    - studies/01_finemapping/fine-mapping.qmd
    - studies/02_prediction/report.qmd
    - studies/03_parameter_estimation/parameter-estimation.qmd
    - studies/04_convergence/convergence.qmd
    - studies/05_annotation_models/annotation-convergence.qmd
    - studies/06_ld_operator/low-rank-operator.qmd
    - studies/06_ld_operator/sbayesr_ld_robustness/report.qmd
  resources:
    - results/reference/**
    - studies/06_ld_operator/sbayesr_ld_robustness/README.md
    - studies/06_ld_operator/sbayesr_ld_robustness/analysis.R
    - studies/06_ld_operator/sbayesr_ld_robustness/scripts/*.R

website:
  title: "sblrbench"
  site-url: "https://psoerensen.github.io/sblrbench/"
  repo-url: "https://github.com/psoerensen/sblrbench"
  repo-actions: [source, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: framework.qmd
        text: Framework
      - href: metrics.qmd
        text: Metrics
      - href: studies/index.qmd
        text: Benchmarks
      - href: studies/06_ld_operator/sbayesr_ld_robustness/report.qmd
        text: Additional validation
      - href: reproducibility.qmd
        text: Reproducibility

format:
  html:
    toc: true
    code-fold: true
    code-tools: true
    theme: cosmo
    css: styles.css

execute:
  freeze: auto
  warning: false
  message: false
